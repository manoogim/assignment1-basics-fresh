# sweep-warmup.yaml
name: lr-warmup-grid-seed29
method: grid

metric:
  name: validation.validation_loss
  goal: minimize

parameters:
  peak_lr:
    value: 0.005
  warmup_frac:
    value: 0.08
  seed:
    values: [11, 29, 47]

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - tests.nn_train
  - "--config=tests/config/abla_batch/cs336_kagle.yaml"
  - ${args}