# sweep-warmup.yaml
name: lr-warmup-grid-seed29
method: grid

metric:
  name: validation.validation_loss
  goal: minimize

parameters:
  peak_lr:
    value: 0.006
  warmup_frac:
    value: 0.12
  weight_decay:
    values: [0.0, 0.01, 0.03, 0.3]

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - tests.nn_train
  - "--config=tests/config/abla_batch/cs336_kagle.yaml"
  - ${args}