# sweep-warmup.yaml
name: lr-warmup-grid-seed29
method: grid

metric:
  name: validation.validation_loss
  goal: minimize

parameters:
  token_budget:
    value: 'medium'
  seed:
    value: 29
  peak_lr:
    value: 0.0055
  warmup_frac:
    value: 0.12
  weight_decay:
    value: 0.1

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - tests.nn_train
  - "--config=tests/config/abla_batch/cs336_kagle.yaml"
  - ${args}