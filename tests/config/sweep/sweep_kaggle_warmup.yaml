# sweep-warmup.yaml
name: lr-warmup-grid-seed29
method: grid

metric:
  name: validation.validation_loss
  goal: minimize

parameters:
  peak_lr:
    values: [0.006]
  warmup_frac:
    values: [0.04, 0.12]
  seed:
    value: 29

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - tests.nn_train
  - "--config=tests/config/abla_batch/cs336_kagle.yaml"
  - ${args}