program: tests/nn_train.py
name: kaggle-warmup-grid
method: grid

metric:
  name: best_validation_loss.validation_loss
  goal: minimize

parameters:
  scheduler.warmup_frac:
    values: [0.06, 0.10, 0.12]


command:
  - ${env}
  - ${interpreter}
  - '-m'
  - tests.nn_train
  - '--warmup_frac=${scheduler.warmup_frac}'
  - '--config=tests/config/abla_batch/cs336_kagle.yaml'
  - ${args}
