program: tests/nn_train.py
name: kaggle-lr-grid
method: grid

metric:
  name: best_validation_loss.validation_loss
  goal: minimize

parameters:
  peak_lr:
    values:
      - 0.0010
      - 0.0013
      - 0.0017
      - 0.0022
      - 0.0030

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - tests.nn_train
  - "--config=tests/config/abla_batch/cs336_kagle.yaml"
  - ${args}
