program: tests/nn_train.py
name: kaggle-lr-grid
method: grid

metric:
  name: best_validation_loss.validation_loss
  goal: minimize

parameters:
  peak-lr:
    values:
      - 0.0001
      - 0.0002
      - 0.0003
      - 0.0005
      - 0.0008

command:
  - ${env}
  - ${interpreter}
  - m
  - ${program}
  - '--config=tests/config/abla_batch/cs336_kagle.yaml'
  - '--peak_lr=${peak-lr}'
