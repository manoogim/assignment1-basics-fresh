program: tests/nn_train.py
name: kaggle-seed
method: grid

metric:
  name: best_validation_loss.validation_loss
  goal: minimize

parameters:
  seed2:
    values:
      - 0.0070
      - 0.0080


command:
  - ${env}
  - ${interpreter}
  - "-m"
  - tests.nn_train
  - "--config=tests/config/abla_batch/cs336_kagle.yaml"
  - ${args}
