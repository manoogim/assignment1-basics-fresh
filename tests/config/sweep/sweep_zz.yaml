name: zzlr-warmup-grid-seed29
method: grid

metric:
  name: validation.validation_loss
  goal: minimize

parameters:
  peak_lr:
    values: [0.006]
  warmup_frac:
    values: [0.04, 0.12]
  seed:
    value: 29

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - tests.nn_train
  - "--config=tests/config/gpt2_tiny.yaml"
  - ${args}

