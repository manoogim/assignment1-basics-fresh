program: tests/nn_train.py
name: gpt2-tiny-seed-grid
method: grid

metric:
  name: best_validation_loss.validation_loss
  goal: minimize

parameters:
  peak_lr:
    values: [0.004, 0.006]
  seed:
    values: [11, 37]

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - tests.nn_train
  - "--config=tests/config/gpt2_tiny.yaml"
  - ${args}

