name: mb-screen-s1024-eb128-u200
method: grid

metric:
  name: stats.throughput_tokens_per_second
  goal: maximize

parameters:
  grad_accum:
    values: [32, 16, 8]

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - tests.nn_train
  - "--config=tests/config/gpt2_tiny.yaml"
  - ${args}

