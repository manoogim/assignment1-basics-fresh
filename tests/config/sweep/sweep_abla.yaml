name: sweep_abla
method: grid

parameters:
  pos_emb:
    value: "rope"
  
  norm:
    value: "rms"

  peak_lr: 
    values: [0.0020, 0.0005]
  
  wandb_tags:
    value: null

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - tests.nn_train
  - "--config=tests/config/abla_norm/cs336_temp.yaml"
  - ${args}