name: sweep_abla
method: grid

metric:
  name: grad_norm
  goal: experiment

parameters:
  peak_lr:
    values: [0.0055, 0.0020, 0.0005]
  norm:
    value: 'none'
  
  wandb_tags:
    value: sans-norm

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - tests.nn_train
  - "--config=tests/config/abla_norm/cs336_temp.yaml"
  - ${args}