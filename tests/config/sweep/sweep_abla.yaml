parameters:
  peak_lr:
    value: 0.0025
  norm:
    value: 'none'
  
  wandb_tags:
    value: sans_norm,lower_lr

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - tests.nn_train
  - "--config=tests/config/abla_norm/cs336_temp.yaml"
  - ${args}