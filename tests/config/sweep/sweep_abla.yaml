name: sweep_abla
method: grid

parameters:
  peak_lr:
    values: [0.0020, 0.0005]
  norm:
    value: 'rms'
  
  wandb_tags:
    value: postlayer-norm

command:
  - ${env}
  - ${interpreter}
  - "-m"
  - tests.nn_train
  - "--config=tests/config/abla_norm/cs336_temp.yaml"
  - ${args}