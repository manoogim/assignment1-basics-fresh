model:
  vocab_size: 32_000
  seq_len: 1024
  d_model: 768
  d_ff: 2048
  num_layers: 12
  num_heads: 12
  forward_mode: plain

optimizer:
  type: adamw
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.e-8

train:
  batch_size: 128
  grad_accum: 32        
  precision: float32     # CPU-friendly
  max_norm: 1.0
  grad_eps: 1.0e-6

scheduler:
  type: "cosine"
  warmup_frac: 0.12      # e.g. 12% of total steps spent warming up
  cosine_frac: 1.0       # cosine decay spans the (almost-)entire remaining run, the rest is constant at minrate
  minrate: 0.0005
  maxrate: 0.0055

data:
  tokens_folder: '/kaggle/input/datasets/melissamanoog/tokens-owt/owt'
  dtype: 'uint16'       # the tokens are stored as uint16, but will be converted to int32 for training

run:
  ckpt_best_below: 3.0
  num_steps_dbg: 650
  device: 'auto'        # will see what's available at run time, and store the name cpu/cuda under this key
  seed: 29
  out_prefix: runs/
  save_last: True
  save_every_steps: 50  # how often to save checkpoints stats
  log_every_steps: 10   # how often to log stats
  keep_last_ckpts: 4   # will keep this many files on disk
  resume_from: runs/owt_learning29_128_ga32_lr0.0055_327mm_b128/ckpt_d.pt    # name of ckpt resume from or null if starting from 0
  avg_window: 100       # for computing running avg loss 

eval:
  num_batches: 10      # how many batches to use for validation loss
  batch_size: 16       # batch size for validation
  eval_every_steps: 50  # how often to evaluate validation loss
  target_loss: null      # break training loop when validation loss reaches this target
  best_ckpt: null
  eval_seed: 54321

gen:
  temp: 0
  top_k: 10
  max_tokens: 1024
  prompt_path: null
  vocab_folder: null
  special_tokens: [<|endoftext|>]
  model_weights_path: artifacts/best_ckpt-v29/best_ckpt.pt

wandb:
  enabled: True
  proj_name: owt_learning
  tags: null
  active: seeded
  name_templates:
    seeded: '{config.wandb.proj_name}{config.run.seed}_{config.train.batch_size}_ga{config.train.grad_accum}_lr{config.scheduler.maxrate}'
    normed: '{config.wandb.proj_name}{config.run.seed}_{config.model.norm[type]}_lr{config.scheduler.maxrate}'
    roped: '{config.wandb.proj_name}{config.run.seed}_rms_rope_lr{config.scheduler.maxrate}'
    plain: '{config.wandb.proj_name}'
    systems: 's{config.model.seq_len}-eb{config.train.batch_size}-ga{config.train.grad_accum}-u{config.run.num_steps_dbg}'