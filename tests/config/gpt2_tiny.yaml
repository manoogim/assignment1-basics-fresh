model:
  vocab_size: 50257
  seq_len: 256          # size for precomuted RoPE cache, and max context length for training
  d_model: 256          # hidden size (tiny)
  d_ff: 1024            # 4× d_model (standard GPT2 ratio)
  num_layers: 4         # fewer transformer blocks
  num_heads: 4          # must divide d_model cleanly

optimizer:
  type: "adamw"
  lr: 3.e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.e-8

train:
  batch_size: 8         # 8 > 1
  datatype: float32     # CPU-friendly
  max_norm: 1.0
  grad_eps: 1.0e-6

scheduler:
  type: "cosine"
  tw: 2000              # warmup steps
  tc: 5000              # steps with cosine sched, much shorter cosine cycle for tiny model
  minrate: 1.0e-5
  maxrate: 3.0e-4

data:
  train_bin: 'C:/Users/Melissa/stanford/cs336/assignment1-basics-fresh/out/tinystories_GPT4/tokens_train.bin'
  val_bin:   'C:/Users/Melissa/stanford/cs336/assignment1-basics-fresh/out/tinystories_GPT4/tokens_valid.bin'
  dtype: 'uint16'       # the tokens are stored as uint16, but will be converted to int32 for training

run:
  device: 'auto'        # will see what's available at run time, and store the name cpu/gpu under this key
  seed: 17
  name: 'gpt2-tiny'     # name of the run, used for logging and saving checkpoints
  output_dir: 'runs/gpt2-tiny-tinystories'
  save_every_steps: 200  # how often to save checkpoints and print stats
  log_every_steps: 2   # how often to log stats
  keep_last_ckpts: 10   # will keep this many files on disk
  checkpoint_pattern: 'ckpt_{slot}.pt' 
  resume_from: null     # do not resume from any checkpt but start frpom 0
  avg_window: 100       # for computing running avg loss 
  wandb_enabled: false  # whether or not to log to wandb

eval:
  num_batches: 10      # how many batches to use for validation loss
  batch_size: 16       # batch size for validation
  eval_every_steps: 2  # how often to evaluate validation loss

gen:
    temp: 0.5
    top_k: 10
    max_tokens: 1000
    prompt_path: 'C:\\Users\\Melissa\\stanford\\cs336\\assignment1-basics-fresh\\prompts\\tinystoryprompt.txt'
    vocab_folder: 'C:\\Users\\Melissa\\stanford\\cs336\\assignment1-basics-fresh\\out\\tinystories_GPT4'
    special_tokens: ['<|endoftext|>']
    model_weights_path: 'C:\\Users\\Melissa\\stanford\\cs336\\assignment1-basics-fresh\\runs\\gpt2-tiny-tinystories\\ckpt_4.pt'
